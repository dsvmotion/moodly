# Actualizaciones de dependencias y de GitHub Actions (MANUAL §3: cadena de suministro).
# cooldown: solo propone versiones con al menos 14 días publicadas (un paquete
# comprometido suele detectarse y retirarse antes). Las alertas de seguridad de
# Dependabot no esperan. Sus PRs se mergean con el procedimiento de AGENTS.md
# («Mergeo autónomo»): CI en verde sobre el commit exacto. Sin etiquetas: la de
# «dependencias» no existe en el repo y Dependabot avisaba en cada PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # Los tipos de Node siguen la versión del runtime (.nvmrc, Node 24): con los de
    # una versión mayor se podrían usar APIs que en producción no existen.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      parches-y-menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
