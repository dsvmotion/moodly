name: sensitive-paths

# Falla si el PR toca zonas sensibles (scripts/merge-guard/sensitive-paths.txt)
# o debilita tests, salvo que producto le haya puesto la etiqueta
# "revisado-humano" sobre su commit actual. Los agentes nunca ponen ni quitan esa
# etiqueta (AGENTS.md → "Mergeo autónomo").
#
# Corre desde la rama base (hallazgo P-01 de la auditoría de preproducción):
# - pull_request_target ejecuta este archivo, la lista y los scripts tal como
#   están en la rama base, no como los trae el PR. Un PR que cambia la guarda no
#   puede desactivarla para sí mismo.
# - Nunca hace checkout del código del PR ni lo ejecuta: los archivos y el diff
#   se leen por la API de GitHub y se tratan como texto. Si la API no los da
#   (PR enorme), el job falla en cerrado.
# - Permisos mínimos: el job de la guarda lee el PR y solo escribe su check;
#   solo invalidate-review toca el PR, y solo para quitar la etiqueta.
#
# Desde diciembre de 2025, pull_request_target corre siempre el workflow de la
# rama por defecto y su GITHUB_SHA es el último commit de main, no el del PR: el
# check de un job quedaría en main y nunca en el head del PR. Por eso el job se
# llama «guarda» y publica «sensitive-paths» en el head del PR como commit status
# (API de statuses). Un check run creado por la API no lo cuenta la regla de main
# («Required status check "sensitive-paths" is expected», #173, 2026-11-11); un
# commit status sí es un status check. Es el que exigen safe-merge.sh
# (required-statuses.txt) y la protección de main. El
# head se lee de la API antes y después de leer los archivos y el diff: si llegó
# un commit nuevo entre medias, no publica nada (lo hace el run de ese commit).
#
# La etiqueta aprueba un commit concreto: un commit nuevo (synchronize) o una
# reapertura (reopened) la invalidan. En ese run cuenta como ausente y el job
# invalidate-review la quita del PR; hay que volver a revisar y ponerla.
on:
  pull_request_target:
    # edited: un cambio de base vuelve a pasar la guarda.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions: {}

# Sin cancelar: si un evento de etiqueta cancelase el run de un commit nuevo, el
# paso que quita revisado-humano no llegaría a correr. Los runs de un PR van en
# fila y cada uno lee las etiquetas y la base de la API, no del evento.
concurrency:
  group: sensitive-paths-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sensitive-paths:
    name: guarda
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      remove_label: ${{ steps.gate.outputs.remove_label }}
    steps:
      # La rama base, nunca el head del PR (pull_request_target la elige por defecto).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      # Los tests de la propia guarda, en su versión de la rama base.
      - name: Tests de la guarda de mergeo
        run: bash scripts/merge-guard/tests/run.sh

      - name: Archivos y diff del PR (por la API, sin checkout)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          before="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.sha)"
          # Rutas nuevas y, en los renombrados, también la de antes.
          gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt"
          gh api -H "Accept: application/vnd.github.v3.diff" "repos/$GH_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/diff.patch"
          after="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.sha)"
          # La base y las etiquetas de ahora, no las del evento (que puede ser viejo).
          base="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .base.ref)"
          if gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels" --jq '.[].name' | grep -qxF revisado-humano; then
            echo "has_label=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_label=false" >> "$GITHUB_OUTPUT"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          test -s "$RUNNER_TEMP/files.txt"
          [[ "$before" =~ ^[0-9a-f]{40}$ ]]
          echo "head=$after" >> "$GITHUB_OUTPUT"
          if [[ "$before" != "$after" ]]; then
            echo "same_head=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Llegó un commit nuevo mientras se leía el PR: lo revisa el run de ese commit."
          else
            echo "same_head=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Head del PR: $after"; echo "Archivos del PR:"; sed 's/^/  /' "$RUNNER_TEMP/files.txt"
          # Si toca la línea base de las evals, sus dos versiones (merge-base y
          # head), leídas por la API como datos: la guarda compara las claves
          # como JSON (K-01). Si no se pueden leer, el paso falla en cerrado.
          if grep -qxF packages/evals/baseline.json "$RUNNER_TEMP/files.txt"; then
            bash scripts/merge-guard/baseline-versions.sh "$GH_REPO" "$base" "$after" "$RUNNER_TEMP"
            echo "baseline=true" >> "$GITHUB_OUTPUT"
          else
            echo "baseline=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Zonas sensibles y tests debilitados
        id: gate
        env:
          EVENT_ACTION: ${{ github.event.action }}
          HAS_LABEL: ${{ steps.pr.outputs.has_label }}
          BASELINE: ${{ steps.pr.outputs.baseline }}
          BASE: ${{ steps.pr.outputs.base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          result=0
          # Solo PRs contra main: con otra base, los archivos y el diff de la API
          # serían contra esa rama, y el verde serviría después al cambiarla.
          if [[ "$BASE" != "$DEFAULT_BRANCH" ]]; then
            echo "BASE: el PR va contra $BASE, no contra $DEFAULT_BRANCH; la guarda solo da por buenos PRs contra $DEFAULT_BRANCH" > "$RUNNER_TEMP/guard.txt"
            cat "$RUNNER_TEMP/guard.txt"
            bash scripts/merge-guard/sensitive-gate.sh base "$EVENT_ACTION" "$HAS_LABEL" | tee -a "$GITHUB_OUTPUT" || true
            exit 0
          fi
          # Sin tubería: el shell de los pasos no lleva pipefail y el código de salida se perdería.
          baseline=()
          [[ "$BASELINE" == "true" ]] && baseline=("$RUNNER_TEMP/baseline-before.json" "$RUNNER_TEMP/baseline-after.json")
          bash scripts/merge-guard/check-sensitive.sh "$RUNNER_TEMP/files.txt" "$RUNNER_TEMP/diff.patch" ${baseline[@]+"${baseline[@]}"} > "$RUNNER_TEMP/guard.txt" || result=$?
          cat "$RUNNER_TEMP/guard.txt"
          # La decisión se escribe siempre (este paso no falla) para que
          # invalidate-review pueda leerla aunque el veredicto sea "fail".
          bash scripts/merge-guard/sensitive-gate.sh "$result" "$EVENT_ACTION" "$HAS_LABEL" | tee -a "$GITHUB_OUTPUT" || true

      - name: Status sensitive-paths en el head del PR
        if: steps.pr.outputs.same_head == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          VERDICT: ${{ steps.gate.outputs.verdict }}
          REMOVE_LABEL: ${{ steps.gate.outputs.remove_label }}
        run: |
          set -euo pipefail
          if [[ "$VERDICT" == "pass" ]]; then
            state=success
            description="Sin zonas sensibles, o con revisión de producto vigente para este commit"
          else
            state=failure
            description="Zonas sensibles o tests debilitados: falta la Revisora y la etiqueta revisado-humano"
          fi
          {
            echo "### Guarda: sensitive-paths → $state en \`$HEAD_SHA\`"
            [[ "$REMOVE_LABEL" == "true" ]] && echo "Commit nuevo o reapertura: la etiqueta revisado-humano ya no vale para este commit y se quita del PR."
            echo '```'; head -c 60000 "$RUNNER_TEMP/guard.txt"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/$GH_REPO/statuses/$HEAD_SHA" -X POST \
            -f state="$state" -f context=sensitive-paths -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID" > /dev/null
          echo "sensitive-paths → $state en $HEAD_SHA"

  invalidate-review:
    name: invalidate-review
    needs: sensitive-paths
    if: always() && needs.sensitive-paths.outputs.remove_label == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Quitar revisado-humano (commit nuevo tras la revisión)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --remove-label revisado-humano
