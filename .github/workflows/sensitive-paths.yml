name: sensitive-paths

# Falla si el PR toca zonas sensibles (scripts/merge-guard/sensitive-paths.txt)
# o debilita tests, salvo que producto le haya puesto la etiqueta
# "revisado-humano" sobre su commit actual. Los agentes nunca ponen ni quitan esa
# etiqueta (AGENTS.md → "Mergeo autónomo").
#
# Corre desde la rama base (hallazgo P-01 de la auditoría de preproducción):
# - pull_request_target ejecuta este archivo, la lista y los scripts tal como
#   están en la rama base, no como los trae el PR. Un PR que cambia la guarda no
#   puede desactivarla para sí mismo.
# - Nunca hace checkout del código del PR ni lo ejecuta: los archivos y el diff
#   se leen por la API de GitHub y se tratan como texto. Si la API no los da
#   (PR enorme), el job falla en cerrado.
# - Permisos mínimos: el job de la guarda solo lee; solo invalidate-review
#   escribe, y solo para quitar la etiqueta.
#
# La etiqueta aprueba un commit concreto: un commit nuevo (synchronize) o una
# reapertura (reopened) la invalidan. En ese run cuenta como ausente y el job
# invalidate-review la quita del PR; hay que volver a revisar y ponerla.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

concurrency:
  group: sensitive-paths-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sensitive-paths:
    name: sensitive-paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      remove_label: ${{ steps.gate.outputs.remove_label }}
    steps:
      # La rama base, nunca el head del PR (pull_request_target la elige por defecto).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      # Los tests de la propia guarda, en su versión de la rama base.
      - name: Tests de la guarda de mergeo
        run: bash scripts/merge-guard/tests/run.sh

      - name: Archivos y diff del PR (por la API, sin checkout)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Rutas nuevas y, en los renombrados, también la de antes.
          gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt"
          gh api -H "Accept: application/vnd.github.v3.diff" "repos/$GH_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/diff.patch"
          test -s "$RUNNER_TEMP/files.txt"
          echo "Archivos del PR:"; sed 's/^/  /' "$RUNNER_TEMP/files.txt"

      - name: Zonas sensibles y tests debilitados
        id: gate
        env:
          EVENT_ACTION: ${{ github.event.action }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'revisado-humano') }}
        run: |
          result=0
          bash scripts/merge-guard/check-sensitive.sh "$RUNNER_TEMP/files.txt" "$RUNNER_TEMP/diff.patch" || result=$?
          # La decisión se escribe siempre (este paso no falla) para que
          # invalidate-review pueda leerla aunque el veredicto sea "fail".
          bash scripts/merge-guard/sensitive-gate.sh "$result" "$EVENT_ACTION" "$HAS_LABEL" | tee -a "$GITHUB_OUTPUT" || true

      - name: Veredicto
        env:
          VERDICT: ${{ steps.gate.outputs.verdict }}
          REMOVE_LABEL: ${{ steps.gate.outputs.remove_label }}
        run: |
          if [ "$REMOVE_LABEL" = "true" ]; then
            echo "::warning::Commit nuevo o reapertura: la etiqueta revisado-humano ya no vale para este commit y se quita del PR."
          fi
          if [ "$VERDICT" = "pass" ]; then
            echo "OK: sin zonas sensibles, o con revisión humana vigente para este commit."
          else
            echo "::error::El PR toca zonas sensibles o debilita tests: necesita el veredicto de una sesión Revisora y la etiqueta revisado-humano sobre este commit (la pone producto, nunca un agente)."
            exit 1
          fi

  invalidate-review:
    name: invalidate-review
    needs: sensitive-paths
    if: always() && needs.sensitive-paths.outputs.remove_label == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Quitar revisado-humano (commit nuevo tras la revisión)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --remove-label revisado-humano
