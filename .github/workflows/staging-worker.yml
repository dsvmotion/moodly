name: Staging · worker

# W2 (ADR 0027): el worker de Railway contra el Supabase de staging. Se lanza a
# mano desde main (Actions → «Staging · worker» → Run workflow):
#
#   role           da login al rol dbos_worker con el secreto DBOS_WORKER_DB_PASSWORD
#                  (como verificador SCRAM: la contraseña en claro no llega a Postgres)
#   rls-role       lo mismo para moodly_worker (datos de las organizaciones bajo RLS,
#                  ADR 0049) con el secreto MOODLY_WORKER_DB_PASSWORD
#   rls-connect    entra como moodly_worker por el pooler en modo sesión, con TLS
#                  verificado, y comprueba que es el rol, que no se salta RLS y que
#                  sin organización fijada (o con una que no existe) no ve nada
#   connect        entra como dbos_worker por el pooler en modo sesión, con TLS verificado
#   lease          el pooler suelta el lock de un proceso muerto (regla 1)
#   smoke-enqueue  encola el workflow de comprobación; el worker de Railway lo empieza
#   smoke-finish   lo despierta por NOTIFY (regla 8) y comprueba que el paso 1 no se
#                  repitió (con «expect_restart», que el último paso lo hizo otro proceso)
#
# Idempotente. Solo toca los roles dbos_worker y moodly_worker y el esquema dbos;
# no lee ni escribe datos de clientes (rls-connect solo cuenta filas visibles,
# que tienen que ser 0). Secretos del entorno `staging`: los del despliegue,
# DBOS_WORKER_DB_PASSWORD y MOODLY_WORKER_DB_PASSWORD (32 o más letras o dígitos;
# las mismas que van en las URLs del servicio de Railway).

on:
  workflow_dispatch:
    inputs:
      action:
        description: Qué hacer
        required: true
        type: choice
        options: [role, connect, lease, smoke-enqueue, smoke-finish, rls-role, rls-connect]
      workflow_id:
        description: ID del workflow de comprobación (smoke-enqueue y smoke-finish)
        required: false
        type: string
      expect_restart:
        description: smoke-finish exige que el último paso lo ejecutara otro proceso
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-worker
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: sgeswmdqstonegceusej

jobs:
  worker:
    name: staging · worker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DBOS_WORKER_DB_PASSWORD: ${{ secrets.DBOS_WORKER_DB_PASSWORD }}
      MOODLY_WORKER_DB_PASSWORD: ${{ secrets.MOODLY_WORKER_DB_PASSWORD }}
      # Por variable de entorno, nunca interpolados en el script.
      ACTION: ${{ inputs.action }}
      WORKFLOW_ID: ${{ inputs.workflow_id }}
      EXPECT_RESTART: ${{ inputs.expect_restart }}
      POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
    steps:
      - name: Entradas válidas
        run: |
          if [[ "$ACTION" == rls-* ]]; then
            if [[ ! "$MOODLY_WORKER_DB_PASSWORD" =~ ^[A-Za-z0-9]{32,128}$ ]]; then
              echo "::error::MOODLY_WORKER_DB_PASSWORD falta o no tiene entre 32 y 128 letras o dígitos"
              exit 1
            fi
          elif [[ ! "$DBOS_WORKER_DB_PASSWORD" =~ ^[A-Za-z0-9]{32,128}$ ]]; then
            echo "::error::DBOS_WORKER_DB_PASSWORD falta o no tiene entre 32 y 128 letras o dígitos"
            exit 1
          fi
          if [[ "$ACTION" == smoke-* && ! "$WORKFLOW_ID" =~ ^[A-Za-z0-9:_-]{1,100}$ ]]; then
            echo "::error::workflow_id es obligatorio en $ACTION (letras, dígitos, «:», «_» o «-»)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter root --filter @repo/db --filter @repo/worker

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.118.0

      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        working-directory: packages/db

      - name: Rol dbos_worker con login
        if: inputs.action == 'role'
        working-directory: packages/db
        run: |
          node bootstrap/worker-role.ts > "$RUNNER_TEMP/worker-role.sql"
          supabase db query --linked --file "$RUNNER_TEMP/worker-role.sql" > /dev/null
          rm -f "$RUNNER_TEMP/worker-role.sql"
          echo "Rol dbos_worker con login (verificador SCRAM)."

      - name: Rol moodly_worker con login
        if: inputs.action == 'rls-role'
        working-directory: packages/db
        run: |
          node bootstrap/worker-role.ts moodly_worker > "$RUNNER_TEMP/worker-role.sql"
          supabase db query --linked --file "$RUNNER_TEMP/worker-role.sql" > /dev/null
          rm -f "$RUNNER_TEMP/worker-role.sql"
          echo "Rol moodly_worker con login (verificador SCRAM)."

      # El host del pooler: la variable del entorno si existe; si no, el que
      # guarda `supabase link`. No es secreto: va también en la URL de Railway.
      - name: Pooler en modo sesión
        id: pooler
        run: |
          host="$POOLER_HOST"
          if [ -z "$host" ] && [ -f packages/db/supabase/.temp/pooler-url ]; then
            host=$(node -e 'console.log(new URL(require("fs").readFileSync(process.argv[1], "utf8").trim()).hostname)' packages/db/supabase/.temp/pooler-url)
          fi
          if [[ ! "$host" =~ ^[a-z0-9.-]+\.supabase\.com$ ]]; then
            echo "::error::No sé el host del pooler: define la variable SUPABASE_POOLER_HOST del entorno staging"
            exit 1
          fi
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "Pooler en modo sesión: $host:5432 (usuario dbos_worker.$SUPABASE_PROJECT_REF)"

      - name: Comprobación
        if: inputs.action != 'role' && !startsWith(inputs.action, 'rls-')
        env:
          HOST: ${{ steps.pooler.outputs.host }}
        run: |
          ca="$GITHUB_WORKSPACE/apps/worker/certs/supabase-prod-ca-2021.crt"
          if [ ! -f "$ca" ]; then
            echo "::error::Falta la CA de Supabase en apps/worker/certs (ver su README)"
            exit 1
          fi
          url="postgresql://dbos_worker.${SUPABASE_PROJECT_REF}:${DBOS_WORKER_DB_PASSWORD}@${HOST}:5432/postgres?sslmode=verify-full&sslrootcert=${ca}"
          echo "::add-mask::$url"
          WORKER_SYSTEM_DATABASE_URL="$url" node apps/worker/scripts/staging-check.ts "$ACTION" "$WORKFLOW_ID"

      - name: Comprobación de moodly_worker
        if: inputs.action == 'rls-connect'
        env:
          HOST: ${{ steps.pooler.outputs.host }}
        run: |
          ca="$GITHUB_WORKSPACE/apps/worker/certs/supabase-prod-ca-2021.crt"
          if [ ! -f "$ca" ]; then
            echo "::error::Falta la CA de Supabase en apps/worker/certs (ver su README)"
            exit 1
          fi
          url="postgresql://moodly_worker.${SUPABASE_PROJECT_REF}:${MOODLY_WORKER_DB_PASSWORD}@${HOST}:5432/postgres?sslmode=verify-full&sslrootcert=${ca}"
          echo "::add-mask::$url"
          WORKER_DATABASE_URL="$url" node apps/worker/scripts/staging-rls-check.ts
