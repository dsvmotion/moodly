name: Staging · agente

# Prueba de punta a punta del agente en staging (paso 4d-3): un mensaje del
# contacto de prueba a Recepción de la organización de demo, el worker de
# Railway lo contesta con el modelo de verdad (Vercel AI Gateway) y aquí se ve
# qué hizo: estado del run, modelo, tokens, coste y las ejecuciones (la
# respuesta nace en borrador).
#
# Se lanza a mano desde main (Actions → «Staging · agente» → Run workflow),
# después de «Staging · organización de demo». Con packages/db/bootstrap/
# staging-agent*.sql: prepara la conversación de prueba (idempotente), escribe
# el mensaje elegido y espera al run. El mensaje sale de una lista fija: nunca
# texto libre en el SQL. Sin service role en la app y sin SQL a mano.
#
# Cada ejecución llama al modelo de verdad: cuesta unos céntimos.

on:
  workflow_dispatch:
    inputs:
      message:
        description: Qué escribe el contacto de prueba
        required: true
        type: choice
        default: saludo
        options: [saludo, huecos, reservar, precio]

permissions:
  contents: read

concurrency:
  group: staging-agent
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: sgeswmdqstonegceusej

jobs:
  agent:
    name: staging · agente
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    defaults:
      run:
        working-directory: packages/db
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Por variable de entorno, nunca interpolado en el script.
      MESSAGE: ${{ inputs.message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.118.0

      # La clave elige uno de estos textos; cualquier otra cosa falla. Sin
      # comillas ni barras: no pueden romper el SQL ni el `sed`.
      - name: Mensaje
        id: message
        run: |
          case "$MESSAGE" in
            saludo) text="Hola, ¿qué podéis hacer por mí?" ;;
            huecos) text="¿Tenéis hueco el próximo lunes por la mañana para una primera visita?" ;;
            reservar) text="Quiero reservar una primera visita el próximo lunes a primera hora." ;;
            # OA04: el precio de la primera visita, el que haya puesto el org_admin en Ajustes → Servicios.
            precio) text="¿Cuánto cuesta una primera visita?" ;;
            *) echo "::error::Mensaje desconocido"; exit 1 ;;
          esac
          echo "text=$text" >> "$GITHUB_OUTPUT"

      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Conversación de prueba con Recepción
        run: supabase db query --linked --file bootstrap/staging-agent.sql > /dev/null

      - name: Mensaje del contacto
        env:
          TEXT: ${{ steps.message.outputs.text }}
        run: |
          sed "s/__MESSAGE__/$TEXT/" bootstrap/staging-agent-message.sql > "$RUNNER_TEMP/staging-agent-message.sql"
          supabase db query --linked --file "$RUNNER_TEMP/staging-agent-message.sql" > /dev/null
          echo "El contacto escribe: $TEXT"

      # El worker crea el run al recoger el evento y lo cierra al acabar el turno.
      # Con --linked, la CLI devuelve las filas como un array; en local, dentro
      # de {"rows": [...]}. El filtro acepta las dos formas.
      - name: Qué hizo el agente
        run: |
          first='(if type == "array" then . else .rows end)[0]'
          for i in $(seq 1 36); do
            supabase db query --linked --output-format json --file bootstrap/staging-agent-summary.sql > "$RUNNER_TEMP/summary.json"
            state=$(jq -r "$first.estado // \"sin run\"" "$RUNNER_TEMP/summary.json")
            if [ "$state" != "sin run" ] && [ "$state" != "running" ]; then break; fi
            sleep 5
          done
          jq "$first" "$RUNNER_TEMP/summary.json"
          case "$state" in
            completed | awaiting_approval) echo "El agente contestó (estado: $state)." ;;
            # Con «precio» y la primera visita sin precio publicado (OA04), pasarla a una persona es lo esperado,
            # pero solo si la primera visita no tiene precio y el agente llamó a request_human (ejecutada):
            # un paso por un fallo (sin AI_GATEWAY_API_KEY, el modelo caído) no la llama, y con precio
            # el agente tiene que contestar con él. Si no, falla: así la corrida sirve de prueba.
            handed_off)
              if [ "$MESSAGE" = "precio" ] && jq -e "$first | (.precio_primera_visita == null) and ((.ejecuciones | if type == \"string\" then fromjson else . end) | any(.skill == \"request_human\" and .estado == \"executed\"))" "$RUNNER_TEMP/summary.json" > /dev/null; then
                echo "::notice::El agente pasó la conversación a una persona con request_human: es lo esperado, la primera visita no tiene precio publicado."
              elif [ "$MESSAGE" = "precio" ]; then
                echo "::error::Con «precio», pasar a una persona solo vale si la primera visita no tiene precio y el agente llamó a request_human: mira precio_primera_visita y ejecuciones, y los logs del worker en Railway." ; exit 1
              else
                echo "::warning::El agente pasó la conversación a una persona: mira los logs del worker en Railway (¿falta AI_GATEWAY_API_KEY?)." ; exit 1
              fi ;;
            *) echo "::error::Sin run terminado en 3 minutos (estado: $state): mira los logs del worker en Railway." ; exit 1 ;;
          esac
