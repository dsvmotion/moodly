name: Staging · salud

# Alerta de staging caído (PL-health): cada 15 minutos llama a los endpoints de
# salud de la web (/health, Vercel) y del worker (/health, Railway) y abre o
# actualiza el issue «staging caído»; lo cierra cuando los dos vuelven a responder.
# Mismo patrón que el job `alerta-main` de ci.yml. Sentry sigue capturando errores
# de ejecución; esto cubre lo que Sentry no ve: que nada responda.
#
# Las URLs de staging van fijas aquí (no son secretos: el cuerpo de /health no
# lleva ninguno). Las variables de Actions (Settings → Secrets and variables →
# Actions → Variables) solo las sustituyen, si se definen:
#   STAGING_WEB_HEALTH_URL     por defecto https://staging.moodlycrm.com/health
#   STAGING_WORKER_HEALTH_URL  por defecto https://worker-staging-47c75e8c.up.railway.app/health
# /health solo dice que ALGÚN worker responde: Railway deja activo el despliegue
# anterior si el nuevo no arranca. Por eso, con el secreto RAILWAY_TOKEN (el mismo
# token de proyecto que usa deploy-staging.yml), también se mira el despliegue más
# reciente del servicio worker (API pública de Railway, «List deployments»): si
# terminó en FAILED o CRASHED, o lleva 30 minutos sin terminar, es una caída aunque /health
# responda 200. Sin el
# secreto, esa comprobación no se hace (y se dice en el log).
# Si una comprobación falla, el job falla (en rojo en Actions) y el issue lleva
# la etiqueta `alerta-staging`. Los workflows programados solo corren desde la
# rama por defecto (main).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      worker_url:
        description: "Otra URL de salud del worker solo para esta corrida (https; p. ej. una ruta que no existe, para probar la alerta)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: staging-health
  cancel-in-progress: false

jobs:
  health:
    name: staging · salud
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # RAILWAY_TOKEN es un secreto del entorno `staging` (como en deploy-staging.yml):
    # sin el entorno, el job lo recibe vacío (V10).
    environment: staging
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      WEB_URL: ${{ vars.STAGING_WEB_HEALTH_URL || 'https://staging.moodlycrm.com/health' }}
      WORKER_URL: ${{ inputs.worker_url || vars.STAGING_WORKER_HEALTH_URL || 'https://worker-staging-47c75e8c.up.railway.app/health' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # Servicio `worker` del entorno `staging` del proyecto moodly-staging (los de deploy-staging.yml).
      RAILWAY_PROJECT_ID: a245ed57-493e-47a6-9981-bd79682e1feb
      RAILWAY_SERVICE_ID: f608c7af-ef9e-43d6-9852-97ae42cb73ef
      RAILWAY_ENVIRONMENT_ID: 14a5990a-b326-472d-b27f-84b74d0bcd47
    steps:
      - name: Comprobar los endpoints de salud
        id: probe
        run: |
          failures=""
          checked=0
          probe() {
            name="$1"; url="$2"
            if [ -z "$url" ]; then
              echo "::notice::$name: sin URL de salud configurada; no se comprueba"
              return
            fi
            case "$url" in https://*) ;; *) echo "::error::$name: la URL de salud tiene que ser https://"; failures="$failures $name(url-no-valida)"; checked=$((checked+1)); return ;; esac
            checked=$((checked+1))
            # Dos reintentos (también ante 5xx): un despliegue en curso no es una caída.
            code=$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' \
              --max-time 15 --retry 2 --retry-delay 10 --retry-all-errors "$url" 2>/dev/null || true)
            if [ "$code" = "200" ]; then
              echo "$name: 200"
            else
              echo "::warning::$name: respuesta ${code:-sin respuesta}"
              failures="$failures $name(${code:-sin-respuesta})"
            fi
          }
          probe web "$WEB_URL"
          probe worker "$WORKER_URL"
          # El despliegue más reciente del worker (por fecha de creación, entre los cinco últimos).
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::notice::worker-despliegue: sin RAILWAY_TOKEN; no se comprueba el último despliegue"
          else
            checked=$((checked+1))
            query=$(jq -n --arg p "$RAILWAY_PROJECT_ID" --arg s "$RAILWAY_SERVICE_ID" --arg e "$RAILWAY_ENVIRONMENT_ID" \
              '{query: "query($input: DeploymentListInput!, $first: Int){deployments(input:$input, first:$first){edges{node{id status createdAt}}}}", variables: {input: {projectId:$p, serviceId:$s, environmentId:$e}, first: 5}}')
            if latest=$(curl --silent --show-error --fail --max-time 30 --retry 2 https://backboard.railway.com/graphql/v2 \
                -H "Project-Access-Token: $RAILWAY_TOKEN" -H 'Content-Type: application/json' --data "$query" \
                | jq -er '[.data.deployments.edges[].node] | max_by(.createdAt) | "\(.status) \(.createdAt)"'); then
              echo "worker-despliegue: $latest"
              read -r status created <<< "$latest"
              # La fecha la lee GNU date (vale «Z», «+00:00» y fracciones de segundo).
              if created_s=$(date -u -d "$created" +%s 2>/dev/null); then
                minutes=$(( ($(date -u +%s) - created_s) / 60 ))
              else
                echo "::warning::worker-despliegue: no se pudo leer la fecha «$created»"
                minutes=0
              fi
              echo "worker-despliegue: lleva $minutes min"
              case "$status" in
                FAILED|CRASHED) failures="$failures worker-despliegue($status)" ;;
                # Un despliegue que no termina tampoco sirve (el contenedor nuevo reinicia en bucle).
                QUEUED|WAITING|INITIALIZING|BUILDING|DEPLOYING)
                  [ "$minutes" -ge 30 ] && failures="$failures worker-despliegue($status-${minutes}min)" ;;
              esac
            else
              # Un fallo de la API de Railway no es una caída de staging: aviso, sin alerta.
              echo "::warning::worker-despliegue: no se pudo leer la API de Railway"
            fi
          fi
          echo "checked=$checked" >> "$GITHUB_OUTPUT"
          echo "failures=${failures# }" >> "$GITHUB_OUTPUT"

      - name: Abrir, actualizar o cerrar el issue «staging caído»
        # Sin ninguna URL configurada no hay información: ni se abre ni se cierra nada.
        if: steps.probe.outputs.checked != '0'
        env:
          FAILURES: ${{ steps.probe.outputs.failures }}
        run: |
          title="staging caído"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$FAILURES" ]; then
            body="El endpoint de salud de staging no responde con 200: $FAILURES ($(date -u '+%Y-%m-%d %H:%M UTC')). Comprobación: $RUN_URL"
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "$body"
            else
              gh label create alerta-staging --color B60205 --description "Staging no responde (PL-health)" --force
              gh issue create --title "$title" --body "$body" --label alerta-staging
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Staging vuelve a responder: $RUN_URL"
          fi

      - name: Fallar si alguna comprobación falló
        # Después del issue, para que el aviso salga aunque el job quede en rojo.
        if: steps.probe.outputs.failures != ''
        env:
          FAILURES: ${{ steps.probe.outputs.failures }}
        run: |
          echo "::error::staging no responde con 200: $FAILURES"
          exit 1
