name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Las Actions van fijadas al commit exacto (una etiqueta como @v7 puede moverse a
# otro código). Dependabot (.github/dependabot.yml) propone las actualizaciones.

# P-04: el CI de `main` nunca se cancela y cada commit de `main` tiene su propia
# corrida completa. Dos detalles: (1) `cancel-in-progress` solo en pull_request;
# (2) aunque no se cancele, un grupo de concurrencia deja UNA corrida en curso y
# UNA pendiente, y una pendiente nueva descarta a la anterior, así que dos
# pushes seguidos a `main` perderían la corrida del primero. Por eso, en `main`
# el grupo es el sha del commit (un grupo por commit); en PR, la rama, y cada
# push nuevo al PR cancela el anterior.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Versión de pnpm tomada de "packageManager" en package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Versión de Node tomada de .nvmrc.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Tests de la comprobación de configuración del despliegue
        run: bash scripts/supabase/tests/config-drift.test.sh
      - name: Tests del filtro de secretos del diagnóstico del e2e
        run: bash scripts/ci/tests/e2e-diagnostics.test.sh
      - name: Tests de should-deploy.sh (qué commit despliega staging)
        run: bash scripts/deploy/tests/run.sh
      - name: Revisora automática (tipos y tests, SE01)
        run: |
          pnpm exec tsc -p scripts/reviewer
          node --test scripts/reviewer/*.test.ts
      - run: pnpm build

  evals:
    # Las conversaciones de prueba de los agentes y el set de ataque con el
    # modelo falso (MANUAL §12.4, packages/evals; K-01). También corren dentro
    # de `pnpm test`, pero como check propio y obligatorio: un PR que saque las
    # evals de `pnpm test` o las rompa no puede mergear sin que se vea. No
    # llaman a la red ni cuestan nada; las del modelo real están en evals.yml.
    name: evals · modelo falso
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Versión de pnpm tomada de "packageManager" en package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Versión de Node tomada de .nvmrc.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@repo/evals^...
      # Que corran de verdad: sin --passWithNoTests, y con un mínimo de tests y
      # los dos archivos de los sets. Si un PR cambia la configuración de Vitest
      # para que encuentre menos (o ninguno), falla aquí aunque no borre nada.
      # Bajar EVALS_MIN_TESTS es cambiar este workflow, y se ve en el PR.
      - name: Evals con el modelo falso (y que corren todas)
        env:
          EVALS_MIN_TESTS: "292"
          EVALS_REQUIRED_FILES: "attacks.test.ts conversations.test.ts runset.test.ts baseline.test.ts prompt-cache.test.ts summary-cases.test.ts intents.test.ts handoff.test.ts qualify.test.ts"
        run: |
          report="$RUNNER_TEMP/evals-vitest.json"
          pnpm --filter @repo/evals exec vitest run --reporter=default --reporter=json --outputFile="$report"
          total=$(jq '.numTotalTests' "$report")
          echo "tests de evals: $total (mínimo $EVALS_MIN_TESTS)"
          if [ "$total" -lt "$EVALS_MIN_TESTS" ]; then
            echo "::error::corrieron $total tests de evals; el mínimo es $EVALS_MIN_TESTS"
            exit 1
          fi
          for file in $EVALS_REQUIRED_FILES; do
            if ! jq -e --arg f "$file" '[.testResults[].name | endswith("/" + $f)] | any' "$report" > /dev/null; then
              echo "::error::no corrió $file"
              exit 1
            fi
          done

  db:
    name: db · migraciones · pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Misma versión que en local (ver AGENTS.md → Requisitos).
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      # Solo Postgres (no hace falta el resto del stack): aplica las migraciones.
      - run: supabase db start
      - run: supabase db lint --level warning --fail-on warning
      - run: supabase test db

  e2e:
    name: e2e · Playwright por rol
    runs-on: ubuntu-latest
    # Con la integración del worker (unos 14 min, sobre todo ingress con DBOS) y
    # el e2e (unos 12) el job tarda ya 25-29 min, y con un runner lento la
    # preparación sola ha llegado a 16 (PR #76, 2026-10-23). En #292 los 233 e2e
    # pasaron y el job se cortó a los 30 min justo al acabar.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - run: pnpm install --frozen-lockfile

      # Solo lo que usa la app: Postgres, Auth (gotrue), PostgREST, Kong y
      # Realtime (la bandeja en vivo, M-10 y ADR 0054).
      - name: Supabase local (mínimo)
        working-directory: packages/db
        run: supabase start -x storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # Diagnóstico del e2e intermitente (P-04; run 43121121515, 2026-11-11):
      # Auth no contestó a tiempo durante ~70 s y en local no se reproduce. Desde
      # aquí, Postgres registra esperas de locks y sentencias de más de 2 s, y se
      # muestrea la presión de CPU, E/S y memoria del runner. Solo se sube si el
      # job falla (paso «Diagnóstico del e2e», abajo). No reintenta ni salta nada.
      - name: Diagnóstico del e2e (muestreo)
        # Si el muestreo falla, el job sigue: el diagnóstico nunca pone el CI en rojo.
        continue-on-error: true
        run: bash scripts/ci/e2e-diagnostics.sh start "$RUNNER_TEMP/e2e-diagnostico"

      # Usuarios de prueba con contraseñas generadas en el propio run.
      - run: pnpm db:seed

      # tenantDb contra Supabase de verdad, con la clave secreta y sin RLS
      # (revisión de seguridad 3.2). Crea y borra sus propias filas.
      - run: pnpm --filter @repo/db test:integration

      # El worker real con DBOS, el esquema dbos de las migraciones y el rol
      # sin DDL (al que el seed da login): reanuda un workflow tras matar el
      # proceso con SIGKILL sin repetir pasos (ADR 0027, tarea 6 de la Fase 0),
      # y entrega los eventos del outbox con el tenant de la fila (ADR 0009).
      # Usa compilados los paquetes del monorepo de los que depende (@repo/db,
      # @repo/integrations...): se construyen antes («^...»: sin el worker).
      - run: pnpm turbo run build --filter=@repo/worker^...
      - run: pnpm --filter @repo/worker test:integration
      - run: pnpm --filter @repo/web env:local

      # Navegadores de Playwright en caché por versión: la descarga llegó a tardar
      # varios minutos. Las dependencias del sistema se intentan instalar siempre.
      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(pnpm --filter @repo/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Las dependencias del sistema salen de los mirrors de Ubuntu del runner, que
      # a veces no resuelven durante horas (2026-11-11: «Temporary failure
      # resolving azure.archive.ubuntu.com», #175; tres runs seguidos, el último
      # cancelado por tiempo). La imagen del runner ya trae casi todo lo que
      # necesita Chromium: si apt falla, se avisa y se sigue. Esto no oculta nada:
      # si de verdad falta una librería, Chromium no arranca y el e2e falla.
      # El navegador sale del CDN de Playwright, no de apt.
      # Dos minutos como mucho (2026-11-11: con los mirrors caídos, los 10 minutos de
      # antes llevaban el job a su límite de 30 y GitHub lo cancelaba; con las
      # librerías de la imagen, Chromium arrancó y pasaron los 202 e2e de #175).
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          pnpm --filter @repo/web exec playwright install chromium
          timeout 120 pnpm --filter @repo/web exec playwright install-deps chromium \
            || echo "::warning::playwright install-deps falló (mirrors de Ubuntu); se sigue con las librerías de la imagen del runner"
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          timeout 120 pnpm --filter @repo/web exec playwright install-deps chromium \
            || echo "::warning::playwright install-deps falló (mirrors de Ubuntu); se sigue con las librerías de la imagen del runner"
      - run: pnpm turbo run build --filter=@repo/web...
      - run: pnpm --filter @repo/web e2e

      # Informe y capturas por rol. Las trazas de un test fallido pueden
      # incluir el login con la contraseña generada en este run: solo sirve en
      # la base de datos efímera del runner, que desaparece al terminar.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

      # Si el job falla: logs de Auth, Kong, PostgREST y Postgres desde el
      # muestreo, conexiones y locks en ese momento, y la presión del runner.
      # Sin secretos: el script filtra JWT, claves de Supabase, cabeceras apikey
      # y Authorization y contraseñas (scripts/ci/tests/e2e-diagnostics.test.sh),
      # y nunca escribe variables de entorno. Se guarda 7 días.
      - name: Diagnóstico del e2e
        if: failure()
        run: bash scripts/ci/e2e-diagnostics.sh collect "$RUNNER_TEMP/e2e-diagnostico"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-diagnostico
          path: ${{ runner.temp }}/e2e-diagnostico
          retention-days: 7

  security:
    name: seguridad · dependencias y secretos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action lista los commits del PR con la API de GitHub: sin
    # pull-requests: read falla con 403 «Resource not accessible by integration».
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      # Falla si alguna dependencia (también las de desarrollo) tiene un aviso alto o crítico.
      - run: pnpm audit --audit-level=high

      # Secretos en el código: en un PR revisa sus commits; en main, el historial entero.
      # Falsos positivos revisados a mano en .gitleaksignore.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # P-04: avisa cuando `main` queda en rojo. Un solo issue «main en rojo»: se abre
  # o se actualiza con el enlace de la corrida que falló y se cierra cuando una
  # corrida de `main` termina en verde. Solo este job puede escribir issues.
  alerta-main:
    name: alerta · main en rojo
    needs: [check, evals, db, e2e, security]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Un fallo de `gh` (red, límite de la API) no puede poner el CI en rojo ni
    # bloquear el despliegue a staging, que espera a este workflow.
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RESULTS: ${{ join(needs.*.result, ' ') }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
    steps:
      - name: Abrir, actualizar o cerrar el issue «main en rojo»
        run: |
          # Las corridas de main van en paralelo: una corrida vieja no abre, comenta ni
          # cierra nada; lo hace la del commit que es hoy la cabeza de main (si no se
          # sabe cuál es, no se hace nada).
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha || true)
          if [ "$head" != "$SHA" ]; then
            echo "::notice::Sin cambios en el issue: $SHA ya no es la cabeza de main"
            exit 0
          fi
          title="main en rojo"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          red=false
          for r in $RESULTS; do [ "$r" = "success" ] || red=true; done
          if [ "$red" = true ]; then
            body="El CI de \`main\` no terminó en verde en el commit \`$SHA\`: $RUN_URL (resultados: $RESULTS)."
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "El CI de \`main\` volvió a verde en \`$SHA\`: $RUN_URL"
          fi
