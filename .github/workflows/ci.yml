name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Versión de pnpm tomada de "packageManager" en package.json.
      - uses: pnpm/action-setup@v6

      # Versión de Node tomada de .nvmrc.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  db:
    name: db · migraciones · pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/db
    steps:
      - uses: actions/checkout@v7

      # Misma versión que en local (ver AGENTS.md → Requisitos).
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      # Solo Postgres (no hace falta el resto del stack): aplica las migraciones.
      - run: supabase db start
      - run: supabase db lint --level warning --fail-on warning
      - run: supabase test db
