name: Despliegue a staging

# Migraciones y configuración (Auth, API, base de datos) del proyecto de staging
# desde el CI, nunca a mano (STATUS, fase B2; auditoría R-17). Corre cuando el
# CI termina en verde sobre main, con el commit exacto que comprobó el CI, o a
# mano desde main (Actions → Despliegue a staging → Run workflow).
#
# Orden (PL-deploy): primero el esquema, después el código. Cuando las migraciones
# y la configuración terminan bien, el job `code` despliega la web (Vercel, por su
# deploy hook) y el worker (Railway, por su API con el commit exacto) y espera al
# worker. Si las migraciones fallan, el código no se despliega. Para que esto sea
# el único camino, el despliegue desde git de los dos servicios se apaga (ver
# CLAUDE.md, «Despliegue ordenado»); mientras los secretos de abajo no existan, el
# job no hace nada y sigue valiendo el despliegue desde git de cada plataforma.
# Aun así, cada migración tiene que ser compatible con la versión anterior del
# código (expandir → desplegar → contraer): el código nuevo no llega a la vez, pero
# el viejo sigue corriendo mientras se aplica.
#
# Secretos del entorno `staging` de GitHub (Settings → Environments → staging):
#   SUPABASE_ACCESS_TOKEN  token personal de Supabase (Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   contraseña de la base de datos del proyecto de staging
#   VERCEL_STAGING_DEPLOY_HOOK  URL del deploy hook del proyecto moodly-staging de Vercel
#                          (Settings → Git → Deploy Hooks, rama main). Es un secreto: quien
#                          la tiene puede lanzar despliegues.
#   RAILWAY_TOKEN          token de proyecto de Railway (moodly-staging, entorno staging)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nunca dos despliegues a la vez, y ninguno se cancela a medias.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  # Proyecto moodly-staging (eu-central-1). No es secreto: va en la URL pública.
  SUPABASE_PROJECT_REF: sgeswmdqstonegceusej
  # Servicio `worker` del entorno `staging` del proyecto moodly-staging de Railway
  # (identificadores, no secretos).
  RAILWAY_SERVICE_ID: f608c7af-ef9e-43d6-9852-97ae42cb73ef
  RAILWAY_ENVIRONMENT_ID: 14a5990a-b326-472d-b27f-84b74d0bcd47

jobs:
  migrations:
    name: staging · migraciones
    # workflow_run filtra por el nombre de la rama de origen, y un PR desde un
    # fork puede llamar a su rama «main»: solo vale un push a este repositorio.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    defaults:
      run:
        working-directory: packages/db
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Misma versión que en local y en el CI.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Secretos del entorno staging
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secreto $name en el entorno staging de GitHub"
              exit 1
            fi
          done

      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Lista lo que se va a aplicar antes de aplicarlo (queda en el log).
      - name: Migraciones pendientes
        run: supabase db push --dry-run

      - name: Aplicar migraciones
        run: supabase db push --yes

      - name: Historial tras el despliegue
        run: supabase migration list

      # Auth y el resto de la configuración del proyecto como código (auditoría
      # R-17), con config.toml y su [remotes.staging]: primero lo que va a
      # cambiar (queda en el log), después se aplica y al final se comprueba
      # que no queda ninguna diferencia.
      - name: Configuración, diferencias con staging
        run: supabase config diff --project-ref "$SUPABASE_PROJECT_REF"

      # La salida se guarda: el paso siguiente necesita saber qué propiedades
      # declara config push que no puede aplicar.
      - name: Aplicar configuración
        run: |
          set -o pipefail
          supabase config push --project-ref "$SUPABASE_PROJECT_REF" --yes 2>&1 | tee config-push.txt

      # Ninguna diferencia pendiente ([update] o [remote-only]) salvo las que
      # config push acaba de declarar que no puede aplicar (p. ej.
      # auth.sms.twilio.enabled), que salen como aviso. Las «local-only» son
      # propiedades que la API no devuelve (p. ej. password_requirements): no se
      # pueden comparar y no cuentan. Tests: scripts/supabase/tests.
      - name: Configuración, sin diferencias pendientes
        run: |
          set -o pipefail
          supabase config diff --project-ref "$SUPABASE_PROJECT_REF" 2>&1 | tee config-diff.txt
          # El job corre en packages/db (defaults.run.working-directory): ruta desde la raíz.
          bash "$GITHUB_WORKSPACE/scripts/supabase/config-drift.sh" config-push.txt config-diff.txt

  # El código, solo cuando el esquema ya está aplicado (`needs`): si `migrations`
  # falla o se salta, este job no corre.
  code:
    name: staging · código (web y worker)
    needs: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      VERCEL_STAGING_DEPLOY_HOOK: ${{ secrets.VERCEL_STAGING_DEPLOY_HOOK }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Web (Vercel)
        run: |
          if [ -z "$VERCEL_STAGING_DEPLOY_HOOK" ]; then
            echo "::notice::Sin VERCEL_STAGING_DEPLOY_HOOK: la web sigue desplegándose desde git"
            exit 0
          fi
          # El hook despliega la última versión de main (no admite fijar el commit).
          curl --silent --show-error --fail --max-time 30 --retry 2 -X POST "$VERCEL_STAGING_DEPLOY_HOOK" > /dev/null
          echo "Despliegue de la web lanzado en Vercel"

      - name: Worker (Railway)
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::notice::Sin RAILWAY_TOKEN: el worker sigue desplegándose desde git"
            exit 0
          fi
          api() {
            curl --silent --show-error --fail --max-time 30 --retry 2 https://backboard.railway.com/graphql/v2 \
              -H "Project-Access-Token: $RAILWAY_TOKEN" -H 'Content-Type: application/json' --data "$1"
          }
          # El commit exacto que comprobó el CI y para el que se aplicaron las migraciones.
          query=$(jq -n --arg s "$RAILWAY_SERVICE_ID" --arg e "$RAILWAY_ENVIRONMENT_ID" --arg c "$DEPLOY_SHA" \
            '{query: "mutation($s:String!,$e:String!,$c:String){serviceInstanceDeployV2(serviceId:$s,environmentId:$e,commitSha:$c)}", variables: {s:$s,e:$e,c:$c}}')
          id=$(api "$query" | jq -er '.data.serviceInstanceDeployV2')
          echo "Despliegue del worker lanzado en Railway: $id"
          # Espera al resultado: así el workflow dice si el worker nuevo arrancó.
          for _ in $(seq 1 60); do
            sleep 15
            status=$(api "$(jq -n --arg d "$id" '{query: "query($d:String!){deployment(id:$d){status}}", variables:{d:$d}}')" | jq -er '.data.deployment.status')
            echo "estado: $status"
            case "$status" in
              SUCCESS) exit 0 ;;
              FAILED|CRASHED|REMOVED) echo "::error::El despliegue del worker terminó en $status"; exit 1 ;;
            esac
          done
          echo "::error::El despliegue del worker no terminó en 15 minutos"
          exit 1
