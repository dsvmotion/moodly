name: Evals · modelo real

# Las conversaciones de prueba de los agentes con el modelo de verdad, por
# Vercel AI Gateway (MANUAL §12.4, packages/evals). Cuestan dinero (~1,30 € por
# corrida con una pasada; tope de 2 € por corrida): solo en los PRs que tocan
# lo que cambia el comportamiento de un agente, y a mano. La clave es propia de
# las evals, con su tope mensual en el gateway (decisión de producto,
# 2026-11-09). Todavía no es un check obligatorio.
#
# K-01: corre con la línea base (packages/evals/baseline.json), que no cambia
# la puntuación ni el código: solo etiqueta los fallos conocidos y dice en el
# informe si el rojo es solo suyo. Tras un push a main, con código 1 abre o
# comenta el issue «evals en rojo»; si el rojo es solo de fallos conocidos, solo
# comenta en el issue que ya esté abierto (cada fallo conocido ya se sigue en su
# issue o PR). Con 0 lo cierra. Si falla la vía del modelo (2: red, gateway,
# saldo) o se corta por el tope de gasto (3), el job falla y no toca el issue:
# la corrida no dice nada de los agentes. Las evals de un PR las corre V4 desde
# su sesión, nunca este workflow (P-05).
#
# P-05: la clave no se entrega a código de un PR. El workflow NO corre en
# pull_request: solo en push a main (ya mergeado) y a mano desde main, y el job
# usa el entorno `evals`, cuyo secreto solo pueden leer los despliegues de main
# (regla de ramas del entorno, que se configura en GitHub, no en el repo).

on:
  push:
    branches: [main]
    paths:
      - packages/agent-core/src/**
      - packages/skills/**
      - packages/evals/**
      - packages/config/**
      - packages/integrations/src/booking/**
      - packages/knowledge/src/**
      - .github/workflows/evals.yml
  workflow_dispatch:
    inputs:
      case:
        description: "Un caso concreto (id de --list); vacío = todos"
        required: false
        default: ""
      repeat:
        description: "Corridas por caso (1–5)"
        required: false
        default: "1"

permissions:
  contents: read

# Las Actions van fijadas al commit exacto, como en ci.yml.

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    name: evals · conversaciones con el modelo real
    # Nunca desde otra rama (un workflow_dispatch se puede lanzar sobre cualquiera).
    if: github.ref == 'refs/heads/main'
    # El secreto AI_GATEWAY_EVALS_API_KEY vive en este entorno, limitado a main.
    environment: evals
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      code: ${{ steps.evals.outputs.code }}
      only_known: ${{ steps.evals.outputs.only_known }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Versión de pnpm tomada de "packageManager" en package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Versión de Node tomada de .nvmrc.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@repo/evals^...

      # Los inputs llegan por env y se validan antes de usarlos: nunca se
      # interpolan en el script.
      - name: Conversaciones de prueba (tope 2 €)
        id: evals
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_EVALS_API_KEY }}
          CASE: ${{ inputs.case }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          report="$RUNNER_TEMP/evals-report.json"
          args=(--max-eur 2 --baseline baseline.json --report "$report")
          if [ -n "${CASE:-}" ]; then
            if [[ ! "$CASE" =~ ^[a-z0-9-]{1,80}$ ]]; then echo "case no válido" >&2; exit 2; fi
            args+=(--case "$CASE")
          fi
          if [ -n "${REPEAT:-}" ]; then
            if [[ ! "$REPEAT" =~ ^[1-5]$ ]]; then echo "repeat tiene que ser de 1 a 5" >&2; exit 2; fi
            args+=(--repeat "$REPEAT")
          fi
          set +e
          pnpm --filter @repo/evals eval:agents "${args[@]}"
          code=$?
          set -e
          only_known=false
          if [ -f "$report" ] && [ "$(jq -r '.onlyKnown' "$report")" = true ]; then only_known=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "only_known=$only_known" >> "$GITHUB_OUTPUT"
          exit "$code"

  alerta-evals:
    name: alerta · evals en rojo
    needs: [evals]
    # Solo tras un push a main: una corrida a mano no abre ni cierra el issue.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      CODE: ${{ needs.evals.outputs.code }}
      ONLY_KNOWN: ${{ needs.evals.outputs.only_known }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
    steps:
      - name: Abrir, actualizar o cerrar el issue «evals en rojo»
        run: |
          title="evals en rojo"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          case "$CODE" in
            1)
              if [ "$ONLY_KNOWN" = true ]; then
                body="Las evals con el modelo real siguen por debajo del umbral en \`main\` (\`$SHA\`), solo por fallos conocidos de packages/evals/baseline.json (cada uno se sigue en su issue o PR): $RUN_URL."
                if [ -n "$number" ]; then
                  gh issue comment "$number" --body "$body"
                else
                  echo "rojo solo por fallos conocidos y sin issue abierto: no se abre uno nuevo"
                fi
              else
                body="Las evals con el modelo real quedaron por debajo del umbral en \`main\` (\`$SHA\`) por algún caso que no es un fallo conocido: $RUN_URL. Umbrales: seguridad 100 %, comportamiento 90 % y ningún caso de comportamiento que falle en sus 3 corridas; los fallos conocidos cuentan igual."
                if [ -n "$number" ]; then
                  gh issue comment "$number" --body "$body"
                else
                  gh issue create --title "$title" --body "$body"
                fi
              fi
              ;;
            0)
              if [ -n "$number" ]; then
                gh issue close "$number" --comment "Las evals con el modelo real vuelven a pasar en \`$SHA\`: $RUN_URL"
              fi
              ;;
            *)
              echo "sin resultado de las evals (código: ${CODE:-ninguno}; 2 = vía del modelo, 3 = tope de gasto): no se toca el issue"
              ;;
          esac
