  - {id: "F02", name: "Reviewer identity: GitHub App Moodly Reviewer created and installed; contents read-only, pull requests read and write, no admin permissions", milestone: "M0", status: "done", evidence: ["Declared by the founder on 2026-11-10; installation 180516622"]}
  - {id: "F03", name: "Connect the reviewer identity and verify it is the one posting reviews", milestone: "M0", status: "in_progress", evidence: ["Declared by the founder on 2026-11-10: the new permission is accepted on the installation, and the App ID and private key are stored in GitHub (proposed names: environment reviewer limited to main, variable REVIEWER_APP_ID, secret REVIEWER_APP_PRIVATE_KEY); GitHub settings cannot be read from the repo", "Declared by the founder on 2026-11-10: REVIEWER_AI_GATEWAY_API_KEY created in the reviewer environment with a 15 USD monthly cap"], note: "Until verified, the Reviewer's reviews are advisory: not formal approvals and not permission to merge. Still needed, owner V1 inside P-01: a workflow that posts the review as the App from the base branch without running pull-request code, access to a model for the review (cost approved by the founder), and a test pull request showing the review signed by the App and whether its approval counts. Do not require approvals on main before that test passes: every pull request is opened under the founder's account, so only the App could approve"}
