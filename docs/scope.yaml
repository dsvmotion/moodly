# Registro de alcance del proyecto.
#
# Fuente: docs/audits/2026-11-10-auditoria-preproduccion.md, secciones 18 y 19 (decisiones de producto del 2026-11-10).
# Estado de cada unidad a fecha del commit c290ee3 de main.
#
# Cómo se usa:
# - Cada unidad tiene id, hito (M0-M4 = piloto, stretch = opcional en M4, after = después del piloto), responsable, estado y evidencia.
# - Estados: planned, in_progress, done, blocked. Una unidad pasa a done solo con evidencia (PR, test, corrida de evals)
#   y cumpliendo el `done_when` de su área.
# - El porcentaje del piloto y del alcance total se calcula con los pesos de `weights`.
# - Los nombres de las unidades están en inglés para casar uno a uno con la sección 19.2 de la auditoría.
# - Añadir, quitar o mover una unidad es decisión de producto.
version: 1
as_of_commit: c290ee3
updated: 2026-11-10
source: docs/audits/2026-11-10-auditoria-preproduccion.md
status_values: [planned, in_progress, done, blocked]
weights: {use_cases: 25, integrations: 15, channels: 10, owner_app: 15, platform: 15, edge: 10, security: 10}

milestones:
  M0: {name: "Safe to build fast", gate: ["A test PR that weakens the merge guard cannot merge", "ADRs for T1, T4, T6, T10 and the integration hub are accepted", "STATUS is generated from this register"]}
  M1: {name: "Platform spine", gate: ["A WhatsApp sandbox message gets exactly one reply, including when a second message arrives mid-turn", "An eu organization completes a turn", "A restore drill is done", "Stopping the staging worker raises an alert"]}
  M2: {name: "Core service in staging", gate: ["RC1-RC6 and CU1-CU3 pass an end-to-end run on the WhatsApp sandbox", "An owner completes business setup without anyone writing SQL", "Real-model evals pass three runs and are a required check"]}
  M3: {name: "Pilot go-live", gate: ["The production exit checklist (audit section 13) is complete", "Sixteen use cases pass on the production configuration", "The pilot client's systems are connected", "The first real customer starts"]}
  M4: {name: "Pilot complete", gate: ["Every pilot unit in this register is done", "Autonomous resolution rate, cost per resolved conversation and value created are measured", "The pilot client's review is recorded"]}
  M5: {name: "Full scope", gate: ["Set per release"]}

# Trabajo de M0 que no es una unidad de alcance: hallazgos de la auditoría (sección 8) a cerrar primero.
m0_findings: ["P-01", "P-02", "P-04", "P-05", "G-02", "G-03", "G-04", "D-01", "D-02", "R-08", "M-07", "M-08"]
m0_extra: ["Restore the safety check loosened by #156 (packages/evals/src/conversations/checks.ts:153), owner V4 (done in #163, see findings K-03)"]

# Hallazgos de la auditoría (sección 8) con trabajo en marcha: un PR que trabaja un hallazgo
# añade o pone al día su fila aquí (docs/WORKSTREAMS.md, regla 1). Mismos estados que las unidades.
findings:
  - {id: "K-03", milestone: "M0", owner: "V4", status: "done", evidence: ["PR #163", "723d604", "PR #165"], note: "El check de afirmaciones vuelve a tratar una condición como afirmar (#163) y el estilo indirecto, «te confirmo que si…», también (#165); solo las preguntas indirectas quedan exentas"}
  - {id: "P-01", milestone: "M0", owner: "V1", status: "in_progress", evidence: ["PR #168", "05c1c93"], note: "La guarda corre desde main con pull_request_target, lee el PR por la API y publica sensitive-paths como commit status en el head del PR (el check run por API no lo contaba la regla de main; #173); lista corta reactivada (con .claude/, .mcp.json, CLAUDE.md/AGENTS.md en subcarpetas, dependencias, pnpm-workspace.yaml, .npmrc, service.ts y scripts/supabase/); lee etiquetas y base de la API y no cancela runs. safe-merge.sh solo cuenta el status de github-actions[bot]. Abierto: ese status lo publica el token de GitHub Actions, el mismo que tienen los workflows del PR, así que se puede falsificar hasta que lo publique una App propia (F03); y la prueba en negativo tras el merge, también con un status falso"}
  - {id: "P-08", milestone: "M0", owner: "V1 + V3", status: "in_progress", evidence: ["PR #162"], note: "Plan del piloto en MANUAL, STATUS y WORKSTREAMS; falta generar STATUS a partir de este registro y el check de documentación en CI"}
  - {id: "G-02", milestone: "M0", owner: "V2", status: "done", evidence: ["PR #169", "apps/web/src/lib/auth/routes.test.ts", "apps/web/e2e/auth.e2e.ts"], note: "safeNextPath comprueba la ruta también después de resolverla: los segmentos de punto ya no dejan salir un //host. Se podía explotar con sesión abierta, en /login?next=…"}
  - {id: "M-07", milestone: "M0", owner: "V2", status: "done", evidence: ["PR #171", "apps/web/e2e/inbox-pages.e2e.ts", "apps/web/e2e/approvals-pages.e2e.ts"], note: "El filtro de local va en la consulta, antes del tope, en la bandeja y en las aprobaciones; la bandeja se pagina por posición. e2e de carga con Demo F (#170): 106 abiertas y 105 cerradas en dos páginas sin repetir ninguna, y lo de F2 sale al elegir F2"}
  - {id: "M-08", milestone: "M0", owner: "V2", status: "done", evidence: ["PR #172", "apps/web/src/lib/time-zone.test.ts", "apps/web/e2e/time-zone.e2e.ts"], note: "Las horas del hilo van en la zona de su local; la zona se escribe al lado si la organización tiene más de una (Demo F: Madrid y Canarias) o si el dispositivo está en otra. Con el servidor en UTC"}
  - {id: "N-01", milestone: "M0", owner: "V3", status: "in_progress", evidence: ["PR #187", "PR #N01B", "apps/site/scope-status.mjs", "apps/site/src/components/availability.jsx"], note: "Parte 1: las 121 integraciones de /integraciones llevan su estado sacado de este registro al compilar (done = Disponible; M0-M4 = En el piloto; after o stretch = En hoja de ruta), y la compilación falla si una no tiene unidad. Parte 2: la portada (los cinco agentes, plug and play y sus tres skills, aprobaciones, memoria, coach e integraciones). Falta: agentes, producto, enterprise, seguridad, modelos, app móvil y precios y la lista de afirmaciones sin unidad para producto"}

# Tareas de producto (Diego): lo que ninguna sesión puede hacer. No cuentan en el porcentaje de alcance.
