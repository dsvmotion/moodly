<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión</title>
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #f4f4f5;
        --ink: #000000;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0b0b0c;
          --ink: #f4f4f5;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 16px;
        box-sizing: border-box;
        background: var(--canvas);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 400;
        letter-spacing: -0.48px;
      }
      p {
        margin: 0;
        font-size: 14px;
        line-height: 21px;
      }
      a {
        margin-top: 16px;
        padding: 10px 18px;
        border-radius: 800px;
        background: var(--ink);
        color: var(--canvas);
        font-size: 14px;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #2457f5;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <h1>Sin conexión</h1>
    <p>Vuelve a intentarlo cuando tengas internet.</p>
    <a href="">Reintentar</a>
  </body>
</html>
